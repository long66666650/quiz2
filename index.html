<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>铁路刷题题库</title>
<style>
:root{--bg:#eef8ff;--card:#fff;--text:#24364a;--muted:#718096;--line:#dfeaf3;--accent:#5b8ff9;--ok:#18b981;--bad:#ef6464}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:linear-gradient(180deg,#dff3ff 0%,#f8fcff 42%,#fffaf0 100%);min-height:100vh}
.app{max-width:760px;margin:auto;padding:14px 12px 28px}.hidden{display:none!important}
.hero{padding:18px;border-radius:24px;background:linear-gradient(135deg,#fff7bf,#e5f6ff 55%,#eafff3);border:1px solid #e8efd8;box-shadow:0 10px 30px rgba(70,130,170,.08);margin-bottom:12px}
.hero h1{margin:0 0 6px;font-size:24px;color:#2f65c8}.hero p{margin:0;color:#66798a;line-height:1.6;font-size:14px}
.card{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 10px 26px rgba(72,126,170,.07);margin-bottom:12px}
.setbtn{width:100%;text-align:left;border:1px solid #dfeaf3;border-radius:18px;padding:16px;margin:10px 0;background:linear-gradient(135deg,#fff,#f6fbff);font-size:17px;font-weight:800;color:var(--text)}
.setbtn small{display:block;margin-top:5px;font-size:13px;font-weight:500;color:var(--muted);line-height:1.55}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label.title{display:block;font-size:13px;color:var(--muted);margin:0 0 7px}
select,input[type=text]{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 12px;font-size:16px;color:var(--text)}
button{min-height:46px;border:0;border-radius:14px;padding:12px 14px;font-size:16px;font-weight:750;cursor:pointer}
.primary{background:linear-gradient(135deg,#5aa7ff,#7b7cff);color:#fff;box-shadow:0 6px 15px rgba(79,140,255,.22)}.secondary{background:#eef6fb;color:#31506b}
.start{width:100%;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{text-align:center;background:#f6fbff;border:1px solid #e5eff8;border-radius:15px;padding:10px 5px}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:var(--muted)}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}.q{font-size:19px;font-weight:760;line-height:1.65;margin:14px 0;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid #e1ebf3;border-radius:16px;padding:13px;margin:9px 0;background:#fff;line-height:1.55}
.opt.correct{border-color:#8ee1c4;background:#edfff7}.opt.wrong{border-color:#ffb1b1;background:#fff3f3}.key{font-weight:800;min-width:25px;color:#42607a}
.feedback{margin-top:12px;padding:12px 14px;border-radius:15px;line-height:1.6}.feedback.ok{background:#ecfff7;color:#147a59;border:1px solid #a8e9d3}.feedback.bad{background:#fff1f1;color:#b94747;border:1px solid #ffc3c3}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.actions button{flex:1;min-width:110px}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#eef4ff;color:#4b6fc3;font-size:12px;font-weight:700}
.cloze-box,.qa-answer{padding:14px;border-radius:16px;background:#fff9e8;border:1px solid #f2dfa7;line-height:1.8;margin:10px 0;white-space:pre-wrap}
.hint,.mode-note{font-size:13px;color:var(--muted);line-height:1.7;margin-top:8px}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 8px;max-height:430px;overflow:auto;padding:8px 2px}
.qnum{width:52px;height:52px;min-height:52px;padding:0;border-radius:50%;justify-self:center;background:#edf4f8;color:#446176}
.qnum.correct{background:#18c79a;color:#fff}.qnum.wrong{background:#ff6b6b;color:#fff}.qnum.current{outline:3px solid #7b7cff;outline-offset:2px}
.progress{height:9px;border-radius:99px;background:#e8f0f6;overflow:hidden;margin:10px 0 15px}.progress>div{height:100%;background:linear-gradient(90deg,#65b9ff,#7d7cff);width:0}
@media(max-width:430px){.row{grid-template-columns:1fr}.hero h1{font-size:22px}}

.lock-screen{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  background:linear-gradient(180deg,#dff3ff 0%,#f8fcff 45%,#fff8e7 100%);
}
.lock-card{
  width:min(92vw,420px);
  background:rgba(255,255,255,.97);
  border:1px solid #dfeaf3;
  border-radius:24px;
  padding:22px;
  box-shadow:0 18px 50px rgba(72,126,170,.14);
}
.lock-card h2{margin:0 0 8px;color:#2f65c8;font-size:23px}
.lock-card p{margin:0 0 14px;color:#6f8190;line-height:1.65;font-size:14px}
.lock-card input{
  width:100%;height:50px;border:1px solid #dfeaf3;border-radius:14px;
  padding:0 13px;font-size:17px;text-transform:uppercase;background:#fff;
}
.lock-card button{width:100%;margin-top:10px}
.lock-msg{min-height:22px;margin-top:10px;font-size:13px;line-height:1.5}
.lock-msg.bad{color:#c64f4f}.lock-msg.ok{color:#16815f}
.license-chip{
  margin-top:10px;padding:9px 11px;border-radius:12px;background:#f4f8fb;
  color:#6b7c8b;font-size:12px;word-break:break-all;
}

</style>
</head>
<body>

<div id="lockScreen" class="lock-screen">
  <div class="lock-card">
    <h2>🔐 一次性激活</h2>
    <p>每个密码只能激活一次。首次激活成功后，该密码立即失效；这台浏览器会保存专属激活凭证，以后自动进入。</p>
    <input id="licenseInput" type="text" autocomplete="off" autocapitalize="characters" placeholder="输入专属密码">
    <button id="licenseBtn" class="primary">激活本机</button>
    <div id="licenseMsg" class="lock-msg"></div>
  </div>
</div>




<div class="app">
<section id="home">
  <div class="hero"><h1>☀️ 铁路刷题题库</h1><p>第一套做成无限变式练习，可选单选、多选、判断；第二套保持原来的 369 题和原题型，不做改动。</p></div>
  <div class="card">
    <button class="setbtn" id="goFirst">第一套 · 无限变式刷题<small>可选单选 / 多选 / 判断 / 混合；可选简单 / 一般 / 困难。</small></button>
    <button class="setbtn" id="goSecond">第二套 · 高级工综合题库<small>保持原版：选择、判断点选判题；填空、实作、简答、论述、计算直接看原题和答案。</small></button>
  </div>
</section>

<section id="firstSetup" class="hidden">
  <div class="hero"><h1>第一套 · 无限变式刷题</h1><p>同一套知识点一直变着出，尽量避免连续重复。</p></div>
  <div class="card">
    <div class="row"><div><label class="title">题型</label><select id="typeSel"><option value="mixed">混合出题</option><option value="single">只练单选</option><option value="multiple">只练多选</option><option value="judge">只练判断</option></select></div>
    <div><label class="title">难度</label><select id="diffSel"><option value="easy">简单</option><option value="normal" selected>一般</option><option value="hard">困难</option></select></div></div>
    <button id="startFirst" class="primary start">开始无限刷题</button>
    <button id="firstHome" class="secondary start">返回两套题库</button>
    <div class="mode-note">简单：判断题改动较直白；一般：正常变式；困难：判断题会用更容易混淆的表述，选择题干扰项也更接近正确答案。</div>
  </div>
</section>

<section id="firstQuiz" class="card hidden">
  <div class="stats"><div class="stat"><b id="fDone">0</b><span>本轮已做</span></div><div class="stat"><b id="fRight">0</b><span>答对</span></div><div class="stat"><b id="fAcc">0%</b><span>正确率</span></div></div>
  <div class="meta"><span id="fSerial">第 1 题</span><span id="fTag" class="badge">一般 · 混合</span></div>
  <div id="fQuestion" class="q"></div><div id="fCloze" class="cloze-box hidden"></div><div id="fOptions"></div>
  <div id="fFillArea" class="hidden"><input id="fFillInput" type="text" autocomplete="off" placeholder="输入你认为缺少的内容"><button id="fCheckFill" class="primary" style="width:100%;margin-top:10px">检查答案</button></div>
  <div id="fFeedback" class="feedback hidden"></div>
  <div class="actions"><button id="fBack" class="secondary">重新选择</button><button id="fNext" class="primary">换一道</button></div>
</section>

<section id="secondHome" class="hidden">
  <div class="hero"><h1>第二套 · 高级工综合题库</h1><p>第二套保持原版，不改变题目和题型。</p></div>
  <div class="card">
    <button class="setbtn sMode" data-mode="all">顺序练习<small>从上次位置继续。</small></button>
    <button class="setbtn sMode" data-mode="random">随机练习<small>随机顺序，进度单独保存。</small></button>
    <button class="setbtn sMode" data-mode="wrong">错题重练<small>只练做错的选择/判断题。</small></button>
    <button class="secondary start" id="secondBackHome">返回两套题库</button>
  </div>
</section>

<section id="secondQuiz" class="card hidden">
  <div class="meta"><span id="sPos">第 1 / 369 题</span><span id="sSource" class="badge"></span></div>
  <div class="progress"><div id="sBar"></div></div>
  <div id="sQuestion" class="q"></div><div id="sOptions"></div><div id="sQaAnswer" class="qa-answer hidden"></div>
  <div id="sFeedback" class="feedback hidden"></div>
  <div class="actions"><button id="sPrev" class="secondary">上一题</button><button id="sPaletteBtn" class="secondary">题号导航</button><button id="sNext" class="primary">下一题</button></div>
  <div id="sPaletteWrap" class="hidden"><div class="palette" id="sPalette"></div></div>
  <button id="sExit" class="secondary start">退出本套</button>
</section>
</div>

<script>


const SUPABASE_URL="https://oinjyvwdpclcuyyplthy.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pbmp5dndkcGNsY3V5eXBsdGh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MTg2OTIsImV4cCI6MjEwNDA5NDY5Mn0.rxOf2ENZrI1lCbsf-LWBr94_1I4zSa46RIz_7BzZADw";
const ACTIVATION_TOKEN_KEY="rail_quiz_activation_token_v2";
const DEVICE_ID_KEY="rail_quiz_device_id_v2";

function getDeviceId(){
  let id=localStorage.getItem(DEVICE_ID_KEY);
  if(!id){
    id=(crypto.randomUUID?crypto.randomUUID():("dev-"+Date.now()+"-"+Math.random().toString(36).slice(2)));
    localStorage.setItem(DEVICE_ID_KEY,id);
  }
  return id;
}
function normalizeCode(v){return String(v||"").trim().toUpperCase().replace(/\s+/g,"")}
async function rpc(name, body){
  if(SUPABASE_URL.includes("YOUR_") || SUPABASE_ANON_KEY.includes("YOUR_")){
    throw new Error("后台还没配置好");
  }
  const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":"Bearer "+SUPABASE_ANON_KEY
    },
    body:JSON.stringify(body)
  });
  const txt=await r.text();
  if(!r.ok) throw new Error(txt||("HTTP "+r.status));
  return txt?JSON.parse(txt):null;
}
async function verifyExistingActivation(){
  const token=localStorage.getItem(ACTIVATION_TOKEN_KEY);
  if(!token) return false;
  try{
    const ok=await rpc("verify_activation",{p_token:token,p_device_id:getDeviceId()});
    return ok===true;
  }catch(e){return false}
}
async function activateCode(code){
  return await rpc("activate_license",{p_code:normalizeCode(code),p_device_id:getDeviceId()});
}
async function initLicenseGate(){
  const screen=document.getElementById("lockScreen");
  const input=document.getElementById("licenseInput");
  const btn=document.getElementById("licenseBtn");
  const msg=document.getElementById("licenseMsg");

  if(await verifyExistingActivation()){
    screen.classList.add("hidden");
    return;
  }else{
    localStorage.removeItem(ACTIVATION_TOKEN_KEY);
  }

  async function go(){
    const code=normalizeCode(input.value);
    if(!code){
      msg.className="lock-msg bad";
      msg.textContent="请先输入专属密码。";
      return;
    }
    btn.disabled=true;
    btn.textContent="正在激活…";
    msg.textContent="";
    try{
      const res=await activateCode(code);
      if(res && res.ok===true && res.token){
        localStorage.setItem(ACTIVATION_TOKEN_KEY,res.token);
        msg.className="lock-msg ok";
        msg.textContent="激活成功。这个密码已经失效，本机以后会自动进入。";
        setTimeout(()=>screen.classList.add("hidden"),600);
      }else{
        msg.className="lock-msg bad";
        msg.textContent=(res&&res.message)||"激活失败：密码无效或已经被使用。";
      }
    }catch(e){
      msg.className="lock-msg bad";
      msg.textContent=e.message==="后台还没配置好" ? "网站后台还没配置完成。" : "连接激活服务器失败，请稍后重试。";
    }finally{
      btn.disabled=false;
      btn.textContent="激活本机";
    }
  }
  btn.addEventListener("click",go);
  input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();go()}});
}
window.addEventListener("DOMContentLoaded",initLicenseGate);

菱形交叉的两组锐角辙叉、 两组钝角辙叉和两组有四根尖轨的 （ ）组成。", "options": [], "answer": [], "source": "填空题", "qa_answer": "双转辙器"}, {"id": 267, "type": "qa", "question": "无缝线路铺设验收标准规定, 缓冲区钢轨接头轨顶面及内侧面要求平齐， 误差不得超过（ ）。", "options": [], "answer": [], "source": "填空题", "qa_answer": "1mm"}, {"id": 268, "type": "qa", "question": "基床性翻浆冒泥其发展过程一般为 （ ）、 局部翻浆冒泥阶段， 区段翻浆冒泥阶段。", "options": [], "answer": [], "source": "填空题", "qa_answer": "道心积水阶段"}, {"id": 269, "type": "qa", "question": "线路综合维修验收评分标准规定， 钢轨在正线及到发线出现接头错牙轨面及内侧错牙大于（ ）时， 每处扣 4 分。", "options": [], "answer": [], "source": "填空题", "qa_answer": "1mm"}, {"id": 270, "type": "qa", "question": "铁路灾害监测系统是铁路行车安全的重要基础保障系统， 由风、 雨、 雪、 地震等自然灾害和（ ）安全监测子系统组成。", "options": [], "answer": [], "source": "填空题", "qa_answer": "异物侵限"}, {"id": 271, "type": "qa", "question": "线路设备维修分综合维修、 经常保养、 （ ）。", "options": [], "answer": [], "source": "填空题", "qa_answer": "临时补修"}, {"id": 272, "type": "qa", "question": "尖轨、 可动心轨有下列伤损或病害， 应及时修理或更换当： 尖轨、 可动心轨顶面宽（ ）及以上断面处， 尖轨顶面低于基本轨顶面、 可动心轨顶面低于翼轨顶面2mm及以上。", "options": [], "answer": [], "source": "填空题", "qa_answer": "50mm"}, {"id": 273, "type": "qa", "question": "铺设无缝线路应有无缝线路铺设位置配轨图表、 预留轨缝表、 （ ）范围及有关设计计算书。", "options": [], "answer": [], "source": "填空题", "qa_answer": "锁定轨温"}, {"id": 274, "type": "qa", "question": "道岔综合维修验收评分标准规定， 如果有心轨螺栓缺少， 松动扣 （ ）分。", "options": [], "answer": [], "source": "填空题", "qa_answer": "41"}, {"id": 275, "type": "qa", "question": "道岔综合维修验收评分标准规定， 轨顶面或内侧面错牙大于 1mm 时扣（ ）分。", "options": [], "answer": [], "source": "填空题", "qa_answer": "4"}, {"id": 276, "type": "qa", "question": "当道岔后两股轨道平行， 且两平行股道的直线间距不大于 （ ）m 时，道岔曲股岔尾后的曲线称为道岔连接曲线。", "options": [], "answer": [], "source": "填空题", "qa_answer": "5.2"}, {"id": 277, "type": "qa", "question": "隧道内可以采用 （ ）代替普通钢轨。", "options": [], "answer": [], "source": "填空题", "qa_answer": "耐蚀轨"}, {"id": 278, "type": "qa", "question": "铁路总公司轨道检查车， 对允许速度大于 120km/h 的线路及其他主要繁忙干线进行（ ）检查。", "options": [], "answer": [], "source": "填空题", "qa_answer": "定期"}, {"id": 279, "type": "qa", "question": "检查线路上的伤损钢轨时应作标记， 其中伤损种类为连续伤损的轻伤标记为（ ）。", "options": [], "answer": [], "source": "填空题", "qa_answer": "│ ← △ → │"}, {"id": 280, "type": "qa", "question": "当裂纹贯通整个轨头截面和轨底截面时， 即判定为钢轨 （ ）。", "options": [], "answer": [], "source": "填空题", "qa_answer": "折断"}, {"id": 281, "type": "qa", "question": "冻害垫板使用规定（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "顺垫板重叠使用不得超过 2块，总厚度不得超过 15mm；横垫板重叠使用不得超过 3块，较厚 的垫板应放在下层。"}, {"id": 282, "type": "qa", "question": "无缝道岔固定型辙叉接头冻结扭矩要求（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "固定型辙叉接头冻结应采用高强度螺栓，扭矩应保持 1100～1400N•m。"}, {"id": 283, "type": "qa", "question": "钢轨头部总磨耗的计算公式（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "总磨耗=垂直磨耗+1/2侧面磨耗。"}, {"id": 284, "type": "qa", "question": "vmax≤120km/h正线、到发线及其他站线，60kg/m钢轨侧面磨耗的重伤标准（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "vmax≤120km/h正线、到发线及其他站线，60kg/m钢轨侧面磨耗的重伤标准 19mm。"}, {"id": 285, "type": "qa", "question": "vmax≤120km/h正线、到发线及其他站线，50kg/m钢轨侧面磨耗的重伤标准（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "vmax≤120km/h正线、到发线及其他站线，50kg/m钢轨侧面磨耗的重伤标准 17mm。"}, {"id": 286, "type": "qa", "question": "温度应力式无缝线路的构成（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "温度应力式无缝线路，一般由固定区、伸缩区、缓冲区三部分构成。"}, {"id": 287, "type": "qa", "question": "出现何种伤损或病害时应对基本轨进行及时修理或更换（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "（1）曲股基本轨的弯折点位置或弯折尺寸不符合要求，造成轨距不符合规定。 （2）基本轨垂直磨耗，50kg/m及以下钢轨，在正线上超过 6mm，到发线上超过 8mm，其他站线 上超过10mm；60kg/m及以上钢轨，在允许速度大于 120km/h的正线上超过 6mm，其他正线上超过 8mm， 到发线上超过 10mm，其他站线上超过 11mm（33kg/m及其以下钢轨由铁路局集团公司规定）。 （3）其他伤损达到钢轨轻伤标准时。"}, {"id": 288, "type": "qa", "question": "道岔和调节器尖轨或基本轨伤损时的更换要求（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "道岔和调节器尖轨或基本轨伤损时，宜同时更换尖轨和基本轨。如单独更换尖轨时，在更换前 应校核尖轨几何尺寸，更换后应进行基本轨、尖轨顺坡打磨，保证换后符合技术标准。"}, {"id": 289, "type": "qa", "question": "高锰钢整铸辙叉垂直磨耗重伤标准（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "辙叉心宽 40mm断面处，辙叉心垂直磨耗（不含翼轨加高部分），50kg/m及以下钢轨，在正线 上超过6mm，到发线上超过 8mm，其他站线上超过 10mm；60kg/m及以上钢轨，在允许速度大于 120km/h 的正线上超过 6mm，其他正线上超过 8mm，到发线上超过 10mm，其他站线上超过 11mm；可动心轨宽 40mm断面及可动心轨宽 20mm断面对应的翼轨垂直磨耗（不含翼轨加高部分）超过 6mm（33kg/m及 以下钢轨由铁路局集团公司规定）。"}, {"id": 290, "type": "qa", "question": "无缝道岔更换后尖轨及限位器要求（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "左右两股尖轨应方正，相错量不超过 10mm。在锁定轨温范围内铺设时，限位器要求居中，焊 联前测量，尖轨限位器两侧间隙值允许偏差±1.0mm。"}, {"id": 291, "type": "qa", "question": "无缝道岔更换后侧线和渡线的锁定要求（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "侧线和渡线应锁定，锁定长度一般情况下不小于75m，困难情况下不小于 50m；若侧线在近距 离内（不到 50m）有邻线道岔，则应加强邻线道岔的锁定。"}, {"id": 292, "type": "qa", "question": "道岔护轨轮缘槽标准宽度（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "护轨平直部分轮缘槽标准宽度为 42mm，侧向轨距加宽时，侧向轮缘槽宽度等量加宽，容许误 差为+3，-1mm；缓冲段末端轮缘槽宽度不小于 65mm，侧向轨距加宽时，侧向缓冲段末端轮缘槽宽度等 量加宽。"}, {"id": 293, "type": "qa", "question": "钢轨折断后紧急处理的方法和放行列车条件（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "紧急处理——当钢轨断缝不大于 50mm时，应立即进行紧急处理。在断缝处上好夹板或臌包夹 板，用急救器固定，在断缝前后各 50m拧紧扣件，并派人看守，放行列车速度不超过 15km/h。如断缝 小于 30mm时，放行列车速度不超过 25km/h。有条件时应在原位焊复，否则应在轨端钻孔，上好夹板或 臌包夹板，拧紧接头螺栓，然后可适当提高行车速度。"}, {"id": 294, "type": "qa", "question": "钢轨折断后临时处理的方法和放行列车条件（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "临时处理——钢轨折损严重或断缝大于 50mm，以及紧急处理后，不能立即焊接修复时，应封 锁线路，切除伤损部分，两锯口间插入长度不短于 6m的同型钢轨，轨端钻孔，上接头夹板，用 10.9级 螺栓拧紧。在短轨前后各 50m范围内，拧紧扣件后，按正常速度放行列车，但不得大于 160km/h。"}, {"id": 295, "type": "qa", "question": "道岔查照间隔（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "道岔查照间隔（辙叉心作用面至护轨头部外侧的距离）在有客车运行的线路上不得小于 1391mm， 在仅运行货车的线路上不得小于 1388mm；测量位置按设计图纸规定。"}, {"id": 296, "type": "qa", "question": "接头夹板伤损达到何种标准，应及时更换（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "（1）折断。 （2）中间两螺栓孔范围内裂纹：正线、到发线有裂纹；其他站线平直及异型夹板超过5mm，双头 及鱼尾型夹板超过 15mm。 （3）其他部位裂纹发展到螺栓孔。 （4）胶接绝缘夹板性能不良。"}, {"id": 297, "type": "qa", "question": "道岔护背距离（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "道岔护背距离（辙叉翼作用面至护轨头部外侧的距离）不得大于 1348mm；测量位置按设计图 纸规定。"}, {"id": 298, "type": "qa", "question": "护轨侧面磨耗重伤标准（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "道岔直向允许通过速度 vmax＞120km/h时，护轨侧面磨耗 10mm；道岔直向允许通过速度 vmax ≤120km/h时，护轨侧面磨耗12mm。（磨耗在平直段中点量取）。"}, {"id": 299, "type": "qa", "question": "无缝线路缓冲区钢轨接头规定（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "无缝线路缓冲区钢轨接头必须使用不低于 10.9级的螺栓，螺栓扭矩应保持 700～1100N•m。绝 缘接头轨缝不得小于 6mm。"}, {"id": 300, "type": "qa", "question": "发现何种情况应及时对胶接绝缘接头进行处理（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "（1）胶层及端板破损。 （2）扣件与夹板或螺栓可能接触、轨底道砟堆积过高等。 （3）轨端出现肥边。 （4）有漏电现象时。"}, {"id": 301, "type": "qa", "question": "钢轨钻孔的规定（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "钢轨钻孔位置应在螺栓孔中心线上，且必须倒棱。两螺栓孔的净距不得小于大孔径的 2倍。其 他部门需在钢轨上钻孔或加装设备时，必须征得工务设备管理单位的同意，并有工务人员现场监督。"}, {"id": 302, "type": "qa", "question": "钢轨折断标准（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "钢轨折断是指发生下列情况之一者： 1.钢轨全截面断裂； 2.裂纹贯通整个轨头截面； 3.裂纹贯通整个轨底截面； 4.允许速度不大于 160km/h区段钢轨顶面上有长度大于 50mm且深度大于 10mm的掉块，允许速度 大于 160km/h区段钢轨顶面上有长度大于30mm且深度大于 5mm的掉块。"}, {"id": 303, "type": "qa", "question": "用于线路上的钢轨需要截断要求（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "用于线路上的钢轨需要截断时，应全断面垂直锯断；严禁使用剁子及其他工具强行截断和冲孔； 除符合规定的处理线路故障方式外，严禁使用乙炔切割或烧孔。"}, {"id": 304, "type": "qa", "question": "普通线路钢轨接头根据什么条件预留轨缝（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "普通线路钢轨接头，应根据钢轨长度与钢轨温度预留轨缝。"}, {"id": 305, "type": "qa", "question": "普通线路和无缝线路缓冲区的重伤和折断钢轨应怎样处理（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "普通线路和无缝线路缓冲区的重伤和折断钢轨应及时更换。换下的重伤和折断钢轨应有明显的 标记，防止再用。"}, {"id": 306, "type": "qa", "question": "道口护轨的设置要求（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "护轨两端做成喇叭口，距护轨端 300mm处弯向线路中心，其终端距钢轨工作边应为 150～180mm。"}, {"id": 307, "type": "qa", "question": "道口护轨轮缘槽宽度及深度设置要求（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "轮缘槽宽度，直线上应为 70～100mm，曲线内股应为 90～100mm；轮缘槽深度应为 45～60mm。"}, {"id": 308, "type": "qa", "question": "曲线轨距加宽值的规定（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "（1）曲线半径 R≥295m，轨距加宽值 0mm； （2）曲线半径 295m＞R≥245m，轨距加宽值 5mm； （3）曲线半径 245m＞R≥195m，轨距加宽值 10mm； （4）曲线半径 R＜195m，轨距加宽值 15mm。"}, {"id": 309, "type": "qa", "question": "轨道实设最大超高的规定（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "有砟轨道实设最大超高，在单线上不得大于 125mm，在双线上不得大于 150mm。无砟轨道实 设最大超高不得大于 150mm。"}, {"id": 310, "type": "qa", "question": "未被平衡欠超高的规定（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "未被平衡欠超高不应大于 75mm，困难情况下不应大于 90mm，但允许速度大于 120km/h线路 个别特殊情况下已设置的 90（不含）～110mm的欠超高可暂时保留，但应逐步改造"}, {"id": 311, "type": "qa", "question": "未被平衡过超高的规定（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "未被平衡过超高不应大于 30mm，困难情况下不应大于 50mm，允许速度大于 160km/h线路的 个别特殊情况下不应大于 70mm。"}, {"id": 312, "type": "qa", "question": "缓和曲线长度不足时曲线超高在直线上顺坡的规定（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "允许速度不大于 160km/h线路，如缓和曲线长度不足，顺坡可延至直线上；允许速度为 120（不 含）～160km/h线路，在直线上顺坡坡度不应大于 1/(10vmax)，在直线上顺坡的超高不应大于 8mm；允 许速度不大于 120km/h线路，在直线上顺坡坡度不应大于 1/(9vmax)，在直线上顺坡的超高，有缓和曲 线时不应大于 15mm、无缓和曲线时不应大于 25mm。"}, {"id": 313, "type": "qa", "question": "曲线半径 450m＜R≤800m的曲线正矢作业验收容许偏差管理值（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "缓和曲线的正矢与计算正矢差 3mm，圆曲线正矢连续差 6mm，圆曲线正矢最大最小值差 9mm。"}, {"id": 314, "type": "qa", "question": "尖轨在第一拉杆中心处的设计动程（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "尖轨在第一拉杆中心处的设计动程：直尖轨为 142mm，曲尖轨为 152mm；AT型弹性可弯尖轨 12号普通道岔为 160mm 或 180mm，12号提速道岔为 160mm；18号道岔允许速度大于 160km/h时为 160mm，允许速度不大于 160km/h时为 160mm或 180mm（具体按标准图或设计图规定办理）；其他型 号道岔按标准图或设计图办理。"}, {"id": 315, "type": "qa", "question": "铝热焊缝距轨枕边缘距离的要求（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "铝热焊缝距轨枕边缘，线路允许速度不大于 160km/h线路不应小于 40mm，线路允许速度大于 160km/h线路不应小于100mm。"}, {"id": 316, "type": "qa", "question": "焊接作业温度的规定（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "（1）焊接作业轨温应不低于 0℃，且应避免大风和雨雪等不良天气，否则应采取相应措施。 （2）放行列车时，焊缝温度应低于 300℃。"}, {"id": 317, "type": "qa", "question": "线路起道作业收工时，顺坡率应满足什么要求（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "允许速度不大于 120km/h线路不应大于 2.0‰，允许速度为 120（不含）～160km/h线路不应大 于 1.0‰，允许速度大于 160km/h线路不应大于 0.8‰。"}, {"id": 318, "type": "qa", "question": "道岔转辙部分、辙叉部分改道作业要求（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "在道岔转辙部分改道时，应将曲股基本轨弯折尺寸和尖轨侧弯整修好。在辙叉部分改道时，应 处理好查照间隔、护背距离和翼轨、护轨轮缘槽宽度之间的关系，应用打磨钢轨肥边和间隔铁加垫片等 方法调整好轮缘槽宽度。"}, {"id": 319, "type": "qa", "question": "捣固车起道、拨道作业要求（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "捣固车一次起道量不宜超过 50mm，起道量超过 50mm时应分次起道捣固；一次拨道量不宜超 过 80mm，曲线地段上挑、下压量应尽量接近。每次作业后应进行道床动力稳定。"}, {"id": 320, "type": "qa", "question": "冻害回落时的整修要求（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "冻害回落时，应及时撤出或调整冻害（调高）垫板，做好顺坡，保持轨道几何不平顺在日常保 持容许偏差限度以内。 木枕地段在冬季垫入的全部垫板和混凝土枕地段总厚度超过 10mm的垫板，应在线路解冻后及时撤 出。"}, {"id": 321, "type": "qa", "question": "用绳正法拨正曲线的基本要求（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "（1）曲线两端直线轨向不良，应事先拨正；两曲线间直线段较短时，可与两曲线同时拨正。 （2）在外股钢轨上用钢尺丈量，每 10m设置 1个测点（曲线头尾是否在测点上不限）。 （3）在风力较小条件下，拉绳测量每个测点的正矢，测量 3次，取其平均值。 （4）按绳正法计算拨道量，计算时不宜为减少拨道量而大量调整计划正矢。 （5）设置拨道桩，按桩拨道。"}, {"id": 322, "type": "qa", "question": "线路轨道静态几何不平顺容许偏差管理值（混凝土枕线路）中 80km/h＜vmax≤120km/h 正线线路作 业验收的轨距、水平、高低、轨向、三角坑的容许偏差管理值（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "轨距+6，-2mm、水平 4mm、高低 4mm、轨向（直线）4mm、三角坑（缓和曲线）4mm、三角 坑（直线和圆曲线）4mm。"}, {"id": 323, "type": "qa", "question": "道岔轨道静态几何不平顺容许偏差管理值中 80km/h＜vmax≤120km/h 正线作业验收的轨距、水平、 高低、轨向、三角坑的容许偏差管理值（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "轨距+3，-2mm、水平 4mm、高低 4mm、轨向（直线）4mm、轨向（支距）2mm、三角坑 4mm。"}, {"id": 324, "type": "qa", "question": "沿线工务人员发现线路设备故障危及行车安全时的规定（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "沿线工务人员发现线路设备故障危及行车安全时，应立即连续发出停车信号和以停车手信号防 护，还应迅速通知就近车站和工长或车间主任，并采取紧急措施修复故障设备；如不能立即修复时，应 封锁区间或限速运行。"}, {"id": 325, "type": "qa", "question": "橡胶垫板更换标准（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "橡胶垫板压溃或变形（两侧压宽合计：厚度为 7mm的橡胶垫板超过 15mm，厚度为 10mm的 橡胶垫板超过 20mm）丧失作用，橡胶垫片损坏时，应进行更换。小阻力扣件使用的复合垫板，橡胶与 不锈钢片分离时应及时更换。"}, {"id": 326, "type": "qa", "question": "作业人员作业、休息、绕行停留车辆规定（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "严禁作业人员跳车、钻车、扒车和由车底下、车钩上传递工具材料。休息时不准坐在钢轨、轨 枕头及道床边坡上。绕行停留车辆时其距离应不少于 5m，并注意车辆动态和邻线上开来的列车。"}, {"id": 327, "type": "qa", "question": "野外作业的人身安全要求（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "野外作业遇雷雨时，作业人员应放下手中的金属器具，迅速到安全处所躲避，严禁在大树下、 电杆旁和涵洞内躲避。酷暑、严寒季节，应采取措施，防止中暑、溺水、冻伤和煤气中毒。"}, {"id": 328, "type": "qa", "question": "作业中出现下列迹象时应及时采取防胀措施（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "作业中如出现轨向、高低不良，起道、拨道省力，枕端道砟离缝等胀轨迹象时，必须停止作业， 并及时采取防胀措施。"}, {"id": 329, "type": "qa", "question": "发现胀轨跑道时的处理规定（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "发现胀轨跑道时必须立即拦停列车，尽快采取措施，恢复线路，首列放行列车速度不超过 15km/h， 并派专人看守、整修线路，逐步提高行车速度。"}, {"id": 330, "type": "qa", "question": "胶接绝缘接头拉开及绝缘失效时的处理方法（选择正确答案）", "options": [], "answer": [], "source": "实作题", "qa_answer": "胶接绝缘接头拉开时，应立即复紧两端各 50m线路的扣件，限速不超过 160km/h，并及时进行 永久处理。发现绝缘失效时，应立即进行临时处理并在温度适宜时进行永久处理。"}, {"id": 331, "type": "qa", "question": "简述菱形道岔的检查除普通单开道岔的检查内容要求外还需要检查那些？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "还必须检查前后锐角辙叉的叉前，叉后端的轨距、水平，以及叉心中的轨距，查照间隔，护背距离及轨距； 钝角辙叉前、后半部的叉前，叉后端的轨距、水平和叉心中的查照间隔，护背距离及轨距。"}, {"id": 332, "type": "qa", "question": "简述曲线地段起拨道作业的基本要求。（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "（1）线路中心位移一次不得超过 30mm，一侧拨道量年度累计不得大于 120mm，并不得侵入建筑限界； （2）桥梁上一侧拨道量年累计不得大于 60mm，且应满足线路中心与桥梁中心的偏差，钢梁不大于 50mm，圬工 梁不大于 70mm； （3）在无缝线路上拨道时，严禁超温作业。"}, {"id": 333, "type": "qa", "question": "无缝线路起、拨道作业有何要求？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "无缝线路起道要有足够道砟，起道前要先拨正线路方向；起、拨道机具不得安放在铝热焊缝处；列车通过前 （作业完毕），起道要顺坡捣固，拨道要拨顺；扒开的道床，要及时回填饱满和夯实。"}, {"id": 334, "type": "qa", "question": "简述线路大、中修中轨枕验收的质量标准。（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "（1）位置方正、均匀，间距和偏斜误差不得超过 40mm； （2）无失效，无严重伤损； （3）混凝土宽枕间距和偏斜误差均不得超过 30mm。"}, {"id": 335, "type": "qa", "question": "复式交分道岔有那些优点？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "复式交分道岔铺设主要是根据地理环境、位置减少占地，降低站场造价，可以减少咽喉区长度和站场长度， 减少运营费用，相对提高运输效率，减少道岔组数，设备维修量也相对减少。"}, {"id": 336, "type": "qa", "question": "曲线整正的基本原理中两条假定的内容是什么？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "假定曲线两端切线方向不变，即曲线始终点拨量为零；假定曲线上某一点拨道时，其相邻测点在长度上并不 随之移动。"}, {"id": 337, "type": "qa", "question": "对跨区间无缝线路道床有哪些要求？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "采用一级碎石道砟。III型枕砟肩宽度为 400mm，II型枕及道岔范围内为 450mm；边坡坡度为 1：1.75；砟肩 堆高 150mm；轨枕盒内道床应填平，并低于承轨槽顶面 20～30mm。"}, {"id": 338, "type": "qa", "question": "简述线路大、中修中道床验收的质量标准。（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "（1）清筛清洁，道碴中粒径小于 25mm的颗粒质量不得大于 5％； （2）清筛深度达到设计要求； （3）道床密实、符合设计断面，边坡整齐。"}, {"id": 339, "type": "qa", "question": "造成道岔方向不良的原因有哪些？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "（1）忽视对道岔的整体维修，造成道岔方向不良。 （2）铺设位置不正确，随弯就弯。 （3）加重钢轨及其零件磨耗，作业方法不合理，硬性凑合支距和轨距，造成各连续部不圆顺。 （4）曲基本轨弯折点位置不对，造成转辙器部分轨向不良。 （5）捣固不实，使线路出现坑洼。 （6）道砟不良、夯实不好，降低道床阻力。 （7）钢轨及其零件联结不好，导致方向不正等等。"}, {"id": 340, "type": "qa", "question": "简述普通线路设备大修的分类。（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "线路大修。成段更换再用轨（整修轨）。成组更换道岔和岔枕。成段更换混凝土枕。道口大修。隔离栅栏大修。 其他大修。线路中修。"}, {"id": 341, "type": "qa", "question": "简述整治接头支嘴的方法。（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "（1）利用拨道整治接头支嘴，因支嘴处拨道时，可采用间接影响法。如向外拨动接头时，可拨两侧小腰，用小腰 带动接头向外移动。如果向里拨小腰时，用拨动接头带动小腰向里移动。这样可以减轻甚至消除接头支嘴。 （2）不准在接头处用起道机硬顶拨道。 （3）加强支嘴处的轨道联结，控制轨道横向移动。 （4）加宽上股道床，填足并夯实轨枕盒道砟，或在支嘴前后的轨枕盒的两股钢轨底下设置防爬支撑，以保持曲线 稳定。"}, {"id": 342, "type": "qa", "question": "辙叉垂直磨耗和压溃产生的原因有哪些？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "车轮通过有害空间时，对心轨和翼轨产生冲击作用，辙叉心处的岔枕经常发生吊板；破坏道床坚实性是引起 辙叉垂直磨耗和压溃的主要原因。"}, {"id": 343, "type": "qa", "question": "什么是无缝线路胀轨跑道？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "无缝线路最大特点是在夏季高温季节在钢轨内部存在巨大的温度压力，容易引起轨道横向变形。在列车动力 或人工作业等干扰下，轨道弯曲变形有时会突然增大，这一现象常称为胀轨跑道（也称臌曲）。"}, {"id": 344, "type": "qa", "question": "无缝线路铺设验收标准中,对扣件有什么要求?（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "轨距挡板，挡板座顶严、密靠、压紧，不密贴（缝隙大于 2mm）的数量不超过 6％（连续检查 100头），且无 连续失效；弹条扣件的弹条中部前端下颚应靠贴轨距挡板（离缝不大于 lmm）或螺栓扭矩为 120～150N•m，III型扣件 扣压力为 11～13.2kN，不符合标准的不超过 8％（连续检查 100头），且无连续失效；胶垫无缺损，歪斜量大于 5mm 者不超过 8％（连续检查 100头），螺栓涂油。"}, {"id": 345, "type": "qa", "question": "预防整治导曲线钢轨偏面磨耗的措施？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "（1）在导曲线上股铺设 1/20的铁垫板；（2）根据需要设 6mm的超高，在导曲线范围内按不大于 2‰顺坡；（3） 保持连接部分无钢轨相错。"}, {"id": 346, "type": "qa", "question": "简述绳正法拨正曲线的基本要求。（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "（1）曲线两端直线轨向不良，应事先拨正；两曲线间直线段较短时，可与两曲线同时拨正。 （2）在外股钢轨上用钢尺丈量，每 10m设置 1个测点（曲线头尾是否在测点上不限）。 （3）在风力较小条件下，拉绳测量每个测点的正矢，测量 3次，取其平均值。 （4）按绳正法计算拨道量，计算时不宜为减少拨道量而大量调整计划正矢。 （5）设置拨道桩，按桩拨道。"}, {"id": 347, "type": "qa", "question": "无缝线路地段胀轨跑道的原因是什么？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "轨道温度压力增大；道床横向阻力和轨道框架刚度降低；铺设施工时锁定轨温偏低，低温焊复断缝；施工作 业造成锁定轨温不明，违章作业，线路爬行；线路不平顺和各种附加力的影响。"}, {"id": 348, "type": "qa", "question": "预防、整治导曲线不圆顺措施有哪些？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "（1）保证支距点位置和跟端支距正确； （2）保持轨距尺寸并使递减率合乎要求； （3）导曲线目测圆顺，消灭鹅头； （4）个别处所，通过拨道和改正轨距解决。"}, {"id": 349, "type": "qa", "question": "为什么有的曲线需要确定头尾标桩后，再进行曲线计划正矢计算？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "有的曲线因直线方向变化，头尾位置不对，以致测量出的现场正矢数很不正常。如果在这基础上去计算和拨 正曲线，不仅拨道量大，而且曲线也不能圆顺。在这种情况下，应先通过计算，找出曲线中央点，确定曲线头尾位置， 重新测量现场正矢与计算拨量。"}, {"id": 350, "type": "qa", "question": "辙叉轨距不合标准产生的原因有哪些？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "查照间隔和护背距离不合标准，护轨轮缘槽、辙叉轮缘槽尺寸不合标准是造成辙叉轨距失格的原因。"}, {"id": 351, "type": "qa", "question": "简述线路大、中修中对于新钢轨及配件验收的质量标准。（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "（1）钢轨无硬弯，接头轨面及内侧错牙不得超过 1mm； （2）接头相错：直线不得超过 20mm，曲线不得超过 20mm加缩短轨缩短量的一半； （3）轨缝每千米总误差：25m钢轨不得超过 80mm； （4）接头螺栓涂油，扭矩达到标准。"}, {"id": 352, "type": "qa", "question": "简述尖轨轧伤与侧面磨耗产生的原因有哪些？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "尖轨与基本轨不密贴或假密贴；尖轨顶铁过短；基本轨垂直磨耗超限；尖轨前部顶面受车轮踏面和轮缘的轧、 挤、辗作用。"}, {"id": 353, "type": "qa", "question": "曲线整正的基本原理中四条基本原理的内容是什么？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "（1）现场正矢的合计等于计划正矢的合计； （2）曲线上任意点的拨动，对相邻点正矢的影响量为拨动点拨动量的二分之一，其方向相反； （3）曲线上各点正矢之和为一常数； （4）曲线上各点正矢差之代数和为零，即曲线始、终点的拨量等于零。"}, {"id": 354, "type": "qa", "question": "尖轨扳动不灵活产生的原因有哪些？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "（1）尖轨爬行，两股前后不一致； （2）拉杆或连接杆位置不正确； （3）尖轨跟端双头螺栓磨损或间隔铁夹板磨耗严重，螺栓上紧后影响扳动； （4）基本轨有小弯，滑床板不平直； （5）拉杆、连接杆、接头铁螺栓孔壁磨耗扩大，螺杆磨细。"}, {"id": 355, "type": "qa", "question": "尖轨跳动产生的原因有哪些？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "（1）尖轨跟端轨缝过大，间隔铁和夹板磨耗，螺栓松动，过车时冲击； （2）跟部桥型垫板或凸台压溃； （3）捣固不实，有吊板； （4）尖轨拱腰。"}, {"id": 356, "type": "qa", "question": "简述导曲线不圆顺产生的原因。（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "尖轨跟端和辙叉前后开口尺寸不合标准，支距点位置不对，支距尺寸不标准和作业不细，维修不当以及列车 车轮冲击作用，均可造成导曲线不圆顺。"}, {"id": 357, "type": "qa", "question": "预防、整治辙叉偏磨的措施有哪些？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "焊补偏磨辙叉；可倒换方向使用；加强偏磨部位捣固，且兼顾辙叉水平状态。"}, {"id": 358, "type": "qa", "question": "简述线路大、中修中路基及排水验收的质量标准。（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "（1）路肩平整，无大草,并有向外流水横坡； （2）侧沟捧水畅通； （3）符合设计要求。"}, {"id": 359, "type": "qa", "question": "简述预防整治导曲线轨距扩大的措施。（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "（1）在导曲线外侧设置轨撑，可隔一根枕木或连续设置； （2）整治轨撑离缝消除假轨距； （3）在导曲线外股接头处安装桥型垫板； （4）更换腐朽岔枕； （5）混凝土岔枕要消除扣件挡肩和轨底边离缝。"}, {"id": 360, "type": "qa", "question": "预防整治辙叉垂直磨耗和压溃的措施有那些？（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "（1）加强辙叉底部捣固，特别是叉心和辙叉前后接头处的捣固； （2）借助于更换岔枕的机会，彻底加强辙叉底捣固； （3）在辙叉底岔枕顶面垫胶垫，以缓冲受力； （4）用竖螺栓扣板把辙叉固定在垫板上，加强辙叉的整体稳定性； （5）可在辙叉部位的岔枕上安设特制铁座，用弹条扣件固定辙叉位置。"}, {"id": 361, "type": "qa", "question": "简述导曲线钢轨偏面磨耗产生的原因。（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "由于导曲线外股没有设置超高，长期受离心力作用，导致反超高和上股钢轨偏心磨耗。"}, {"id": 362, "type": "qa", "question": "简述导曲线轨距扩大的原因。（选择正确答案）", "options": [], "answer": [], "source": "简答题", "qa_answer": "列车通过导曲线时，由于离心力、横向推力以及车轮冲击钢轨，致使道钉浮离，配件松动，钢轨有位移。"}, {"id": 363, "type": "qa", "question": "线路、道岔经常保养基本内容。（选择正确答案）", "options": [], "answer": [], "source": "论述题", "qa_answer": "（1）根据轨道几何尺寸超过经常保养容许偏差管理值的状态，成段整修线路。 （2）整治道床翻浆冒泥，均匀道碴，整理道床。 （3）更换和修理轨枕。 （4）调整轨缝，锁定线路。 （5）焊补、打磨钢轨，整治接头病害。 （6）有计划地成段整修扣件，螺栓涂油。 （7）无缝线路应力放散或调整。 （8）更换伤损钢轨，断轨焊复。 （9）整修防沙、防雪设备，整治冻害。 （10）整修道口，疏通排水设备，清除道床杂草和路肩大草。 （11）季节性工作、周期短于综合维修的其他单项工作。"}, {"id": 364, "type": "qa", "question": "线路、道岔临时补修主要内容。（选择正确答案）", "options": [], "answer": [], "source": "论述题", "qa_answer": "（1）整修轨道几何尺寸超过临时补修容许偏差管理值的处所。 （2）更换（或处理）折断、重伤钢轨及桥上、隧道内轻伤钢轨。 （3）更换达到更换标准的伤损夹板，更换折断的接头螺栓、道岔护轨螺栓、可动心轨凸缘与接头铁联结螺栓、可 动心轨咽喉和叉后间隔铁螺栓、长心轨与短心轨联结螺栓、钢枕立柱螺栓等。 （4）调整严重不良轨缝。 （5）疏通严重淤塞的排水设备，处理严重冲刷的路肩和道床。 （6）整修严重不良的道口设备。 （7）其他需要临时补修的工作。"}, {"id": 365, "type": "qa", "question": "一组道岔后连接曲线长 L＝30m，曲线半径 R＝300m，求两股钢轨长度差及两股钢轨长度各是多少？（选择正确答案）", "options": [], "answer": [], "source": "计算题", "qa_answer": "两股钢轨长度差为 150mm；内股钢轨长度 29.925m；外股钢轨长度 30.075m。"}, {"id": 366, "type": "qa", "question": "一根长 1500m的 60㎏/m钢轨，铺设时的锁定轨温为 28℃，当轨温上升到 40℃时，该长轨内部承受什么力？该力有 多大？如果该长轨处于自由伸缩状态，轨温从 28℃上升到 40℃，长轨条伸长量为多少？（60 ㎏/m 钢轨断面积 F=77.45cm2，钢轨轨的线膨胀系数 A=0.0118mm/（m•℃），E•A≈250N/（cm2•℃））（选择正确答案）", "options": [], "answer": [], "source": "计算题", "qa_answer": "长钢轨承受 232350N温度压力，长轨条伸长量为 212.4mm。"}, {"id": 367, "type": "qa", "question": "连接曲线半径为 300m，连接曲线后股道线间距为 4000mm，求警冲标距连接曲线中心线是多少？（选择正确答案）", "options": [], "answer": [], "source": "计算题", "qa_answer": "警冲标距连接曲线中心线距离为 2135mm。"}, {"id": 368, "type": "qa", "question": "已知某普通线路曲线，第 4测点实量正矢为 62，拨量为-8。第 5测点实量正矢为 92，拨量为-18。第 6测点实量正矢 为 108，拨量为-22。求第 5点的拨后正矢。（选择正确答案）", "options": [], "answer": [], "source": "计算题", "qa_answer": "5测点的拨后正矢为 89mm。"}, {"id": 369, "type": "qa", "question": "某地更换 25m长普通线路钢轨，当地最高轨温 62.8℃，最低轨温-22.4℃，作业轨温 28.2℃，请计算预留轨缝。（选择正确答案）", "options": [], "answer": [], "source": "计算题", "qa_answer": "作业时应预留轨缝 6.6mm。"}];

function fPool(t){if(t==="single")return ORIGINAL.filter(q=>q.type==="single");if(t==="multiple")return ORIGINAL.filter(q=>q.type==="multiple");return ORIGINAL}
function fResetBag(){fbag=shuffle(fPool(fc.type).map(q=>q.id))}
function fPick(){if(!fbag.length)fResetBag();let id=fbag.pop(),n=0;while(flast.includes(id)&&fbag.length&&n<15){fbag.unshift(id);id=fbag.pop();n++}flast.push(id);if(flast.length>18)flast.shift();return ORIGINAL.find(q=>q.id===id)}
function fHard(id){return HARD.find(q=>q.id===id)||ORIGINAL.find(q=>q.id===id)}
function fChoice(base){const src=fc.difficulty==="hard"?fHard(base.id):base;let opts=src.options.map(o=>({text:o.text,correct:src.answer.includes(o.key)}));if(fc.difficulty==="easy"&&src.type==="single")opts=[...opts.filter(o=>o.correct),...shuffle(opts.filter(o=>!o.correct)).slice(0,2)];opts=shuffle(opts);return {kind:src.type,question:src.question,options:opts.map((o,i)=>({...o,key:"ABCDEFG"[i]})),sourceId:src.id}}
function mask(s,d){s=String(s).trim();if(s.length<=2)return{display:"【____】",answer:s};let min=d==="easy"?1:d==="normal"?2:Math.max(2,Math.floor(s.length*.35));let max=d==="easy"?Math.min(2,s.length-1):d==="normal"?Math.min(4,s.length-1):Math.max(min,Math.floor(s.length*.65));let len=Math.min(s.length,min+Math.floor(Math.random()*(max-min+1))),start=Math.floor(Math.random()*(s.length-len+1));return{display:s.slice(0,start)+"【____】"+s.slice(start+len),answer:s.slice(start,start+len)}}
function fFill(base){let ct=base.options.filter(o=>base.answer.includes(o.key)).map(o=>o.text),full=ct.join("；"),r=Math.floor(Math.random()*4);if(fc.difficulty==="hard"&&Math.random()<.45)r=3;if(r===2&&ct.length>1){let i=Math.floor(Math.random()*ct.length);return{kind:"fill",question:"多项正确结论里挖掉一项，请补出来：\n"+base.question,cloze:ct.map((t,j)=>i===j?"【____】":t).join("；"),fillAnswer:ct[i],fullAnswer:full}}if(r===3)return{kind:"fill",question:"直接写出这道题的正确答案：\n"+base.question,cloze:"【请填写完整正确答案】",fillAnswer:full,fullAnswer:full};let m=mask(full,fc.difficulty);return{kind:"fill",question:"根据原题正确结论，补全空缺：\n"+base.question,cloze:m.display,fillAnswer:m.answer,fullAnswer:full}}
function fJudge(base){
  const src=fc.difficulty==="hard"?fHard(base.id):base;
  const correctTexts=src.options.filter(o=>src.answer.includes(o.key)).map(o=>o.text);
  const wrongTexts=src.options.filter(o=>!src.answer.includes(o.key)).map(o=>o.text);
  let statement="",truth=true;
  const useTrue=Math.random() < (fc.difficulty==="easy" ? .65 : .5);
  if(useTrue || !wrongTexts.length){
    truth=true;
    if(correctTexts.length===1) statement=correctTexts[0];
    else statement=correctTexts.join("、");
  }else{
    truth=false;
    statement=wrongTexts[Math.floor(Math.random()*wrongTexts.length)];
  }
  return {
    kind:"judge",
    question:"判断下列说法是否正确：\n"+src.question+"\n\n说法："+statement,
    options:[
      {key:"A",text:"正确",correct:truth},
      {key:"B",text:"错误",correct:!truth}
    ],
    sourceId:src.id
  };
}
function fKind(base){if(fc.type!=="mixed")return fc.type;let r=Math.random();if(r<.30)return"judge";if(base.type==="multiple")return"multiple";if(r<.72)return"single";return"multiple"}
function fStats(){$("#fDone").textContent=fdone;$("#fRight").textContent=fright;$("#fAcc").textContent=fdone?Math.round(fright/fdone*100)+"%":"0%"}
function fNext(){flock=false;$("#fFeedback").className="feedback hidden";$("#fOptions").innerHTML="";$("#fFillArea").classList.add("hidden");$("#fCloze").classList.add("hidden");$("#fFillInput").value="";fserial++;let base=fPick(),kind=fKind(base);
if(kind==="multiple"&&base.type!=="multiple"){let ms=ORIGINAL.filter(q=>q.type==="multiple");base=ms[Math.floor(Math.random()*ms.length)]}if(kind==="single"&&base.type!=="single"){let ss=ORIGINAL.filter(q=>q.type==="single");base=ss[Math.floor(Math.random()*ss.length)]}
fcur=kind==="judge"?fJudge(base):fChoice(base);$("#fSerial").textContent="第 "+fserial+" 题";$("#fTag").textContent=({easy:"简单",normal:"一般",hard:"困难"}[fc.difficulty])+" · "+({mixed:"混合",single:"单选",multiple:"多选",judge:"判断"}[fc.type]);$("#fQuestion").textContent=fcur.question;
if(fcur.kind==="fill"){$("#fCloze").textContent=fcur.cloze;$("#fCloze").classList.remove("hidden");$("#fFillArea").classList.remove("hidden");return}
fcur.options.forEach(o=>{let l=document.createElement("label");l.className="opt";let inp=document.createElement("input");inp.type=fcur.kind==="multiple"?"checkbox":"radio";inp.name="fans";inp.value=o.key;let k=document.createElement("span");k.className="key";k.textContent=o.key+".";let t=document.createElement("span");t.textContent=o.text;l.append(inp,k,t);$("#fOptions").append(l);inp.onchange=()=>fGradeChoice()})}
function fSel(){return[...document.querySelectorAll('#fOptions input:checked')].map(x=>x.value)}function fCor(){return fcur.options.filter(o=>o.correct).map(o=>o.key)}function eq(a,b){return a.length===b.length&&[...a].sort().every((x,i)=>x===[...b].sort()[i])}
function fMark(){[...document.querySelectorAll("#fOptions .opt")].forEach((l,i)=>{let o=fcur.options[i],inp=l.querySelector("input");if(o.correct)l.classList.add("correct");if(inp.checked&&!o.correct)l.classList.add("wrong");inp.disabled=true})}
function fGradeChoice(){if(flock)return;let s=fSel(),c=fCor();if(fcur.kind==="multiple"&&s.every(k=>c.includes(k))&&!eq(s,c))return;flock=true;let ok=eq(s,c);fdone++;if(ok)fright++;fStats();fMark();let f=$("#fFeedback");f.className="feedback "+(ok?"ok":"bad");f.textContent=ok?"答对了。":"答错了。正确答案："+fcur.options.filter(o=>o.correct).map(o=>o.text).join("、");if(ok)setTimeout(fNext,280)}
function norm(s){return String(s).replace(/[\s，,。；;、：:（）()【】\[\]]/g,"").toLowerCase()}
function fGradeFill(){if(flock)return;let v=$("#fFillInput").value.trim();if(!v)return alert("先填一下答案。");flock=true;let ok=norm(v)===norm(fcur.fillAnswer);fdone++;if(ok)fright++;fStats();let f=$("#fFeedback");f.className="feedback "+(ok?"ok":"bad");f.textContent=ok?"答对了。":"答案不对。这个空应填："+fcur.fillAnswer+"。完整正确答案："+fcur.fullAnswer;if(ok)setTimeout(fNext,350)}
$("#startFirst").onclick=()=>{fc.type=$("#typeSel").value;fc.difficulty=$("#diffSel").value;fdone=fright=fserial=0;flast=[];fResetBag();fStats();show("firstQuiz");fNext()};$("#fNext").onclick=fNext;$("#fBack").onclick=()=>show("firstSetup");$("#fCheckFill").onclick=fGradeFill;

// SECOND SET unchanged-style engine
const SKEY="rail_quiz_second_unchanged_v1";let ss=JSON.parse(localStorage.getItem(SKEY)||'{"done":{},"wrong":[],"progress":{"all":0,"random":0,"wrong":0},"randomOrder":[],"wrongOrder":[]}');
function saveS(){localStorage.setItem(SKEY,JSON.stringify(ss))}let smode="all",squeue=[],sidx=0,slocked=false;
function sStart(mode){smode=mode;if(mode==="all")squeue=[...SET2];else if(mode==="random"){if(!ss.randomOrder.length)ss.randomOrder=shuffle(SET2.map(q=>q.id));squeue=ss.randomOrder.map(id=>SET2.find(q=>q.id===id)).filter(Boolean)}else{let ids=ss.wrong.length?ss.wrong:[];ss.wrongOrder=ids;squeue=ids.map(id=>SET2.find(q=>q.id===id)).filter(Boolean);if(!squeue.length)return alert("目前没有错题。")}sidx=Math.min(ss.progress[mode]||0,Math.max(0,squeue.length-1));show("secondQuiz");sRender()}
document.querySelectorAll(".sMode").forEach(b=>b.onclick=()=>sStart(b.dataset.mode));
function sRender(){if(!squeue.length)return;let q=squeue[sidx];slocked=false;ss.progress[smode]=sidx;saveS();$("#sPos").textContent=`第 ${sidx+1} / ${squeue.length} 题`;$("#sSource").textContent=q.source||"";$("#sBar").style.width=((sidx+1)/squeue.length*100)+"%";$("#sQuestion").textContent=q.question;$("#sOptions").innerHTML="";$("#sQaAnswer").classList.add("hidden");$("#sFeedback").className="feedback hidden";$("#sPrev").disabled=sidx===0;sPalette();
if(q.type==="qa"){let btn=document.createElement("button");btn.className="secondary";btn.style.width="100%";btn.textContent="查看答案";btn.onclick=()=>{$("#sQaAnswer").textContent=q.qa_answer||"暂无答案";$("#sQaAnswer").classList.toggle("hidden");btn.textContent=$("#sQaAnswer").classList.contains("hidden")?"查看答案":"收起答案"};$("#sOptions").append(btn);return}
q.options.forEach(o=>{let l=document.createElement("label");l.className="opt";let inp=document.createElement("input");inp.type=q.type==="multiple"?"checkbox":"radio";inp.name="sans";inp.value=o.key;let k=document.createElement("span");k.className="key";k.textContent=o.key+".";let t=document.createElement("span");t.textContent=o.text;l.append(inp,k,t);$("#sOptions").append(l);inp.onchange=()=>sGrade(q)})}
function sSelected(){return[...document.querySelectorAll('#sOptions input:checked')].map(x=>x.value)}function sGrade(q){if(slocked)return;let sel=sSelected(),cor=q.answer;if(q.type==="multiple"&&sel.every(k=>cor.includes(k))&&!eq(sel,cor))return;slocked=true;let ok=eq(sel,cor);ss.done[q.id]=ok;if(!ok&&!ss.wrong.includes(q.id))ss.wrong.push(q.id);if(ok)ss.wrong=ss.wrong.filter(id=>id!==q.id);saveS();[...document.querySelectorAll("#sOptions .opt")].forEach((l,i)=>{let o=q.options[i],inp=l.querySelector("input");if(q.answer.includes(o.key))l.classList.add("correct");if(inp.checked&&!q.answer.includes(o.key))l.classList.add("wrong");inp.disabled=true});let f=$("#sFeedback");f.className="feedback "+(ok?"ok":"bad");f.textContent=ok?"答对了。":"答错了。正确答案："+q.options.filter(o=>q.answer.includes(o.key)).map(o=>o.text).join("、");sPalette();if(ok)setTimeout(sNext,220)}
function sNext(){if(sidx<squeue.length-1){sidx++;sRender()}else alert("已经到本模式最后一题了。")}function sPrev(){if(sidx>0){sidx--;sRender()}}
$("#sNext").onclick=sNext;$("#sPrev").onclick=sPrev;$("#sExit").onclick=()=>show("secondHome");$("#sPaletteBtn").onclick=()=>$("#sPaletteWrap").classList.toggle("hidden");
function sPalette(){let p=$("#sPalette");p.innerHTML="";squeue.forEach((q,i)=>{let b=document.createElement("button");b.className="qnum";b.textContent=i+1;if(q.type!=="qa"){if(ss.done[q.id]===true)b.classList.add("correct");else if(ss.done[q.id]===false)b.classList.add("wrong")}if(i===sidx)b.classList.add("current");b.onclick=()=>{sidx=i;$("#sPaletteWrap").classList.add("hidden");sRender()};p.append(b)})}
</script>
</body></html>
